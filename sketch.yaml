default_profile: release

profiles:
    debug:
        notes: Debug build (verbose logging)
        fqbn: esp32:esp32:esp32s3:UploadSpeed=115200,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,LoopCore=1,EventsCore=1,USBMode=default,CDCOnBoot=default,DebugLevel=debug
        platforms:
            - platform: esp32:esp32 (3.3.11)
        libraries:
            - ArduinoJson (7.4.3)
            - Async TCP (3.5.0)
            - ESP Async WebServer (3.12.0)
            - LibSSH-ESP32 (5.9.0)

    debug-full:
        notes: Debug build (verbose logging, erase all flash)
        fqbn: esp32:esp32:esp32s3:UploadSpeed=115200,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,LoopCore=1,EventsCore=1,USBMode=default,CDCOnBoot=default,DebugLevel=debug,EraseFlash=all
        platforms:
            - platform: esp32:esp32 (3.3.11)
        libraries:
            - ArduinoJson (7.4.3)
            - Async TCP (3.5.0)
            - ESP Async WebServer (3.12.0)
            - LibSSH-ESP32 (5.9.0)

    release:
        notes: Release build
        fqbn: esp32:esp32:esp32s3:UploadSpeed=115200,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,LoopCore=1,EventsCore=1,USBMode=default,CDCOnBoot=default
        platforms:
            - platform: esp32:esp32 (3.3.11)
        libraries:
            - ArduinoJson (7.4.3)
            - Async TCP (3.5.0)
            - ESP Async WebServer (3.12.0)
            - LibSSH-ESP32 (5.9.0)

    release-full:
        notes: Release build (erase all flash)
        fqbn: esp32:esp32:esp32s3:UploadSpeed=115200,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,LoopCore=1,EventsCore=1,USBMode=default,CDCOnBoot=default,EraseFlash=all
        platforms:
            - platform: esp32:esp32 (3.3.11)
        libraries:
            - ArduinoJson (7.4.3)
            - Async TCP (3.5.0)
            - ESP Async WebServer (3.12.0)
            - LibSSH-ESP32 (5.9.0)
